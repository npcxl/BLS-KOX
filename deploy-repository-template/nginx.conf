# BLS-KOX 生产 Nginx 配置（复制自项目根 nginx.conf，按需调整 HTTPS）
#
# Browser → Nginx(80) → bls-admin(前端SPA) | bls-server(后端API) | bls-ai-service(AI)
#

server_tokens off;
resolver 127.0.0.11 valid=10s;

limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

upstream bls_server {
    server bls-server:7001 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream bls_admin {
    server bls-admin:80 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream bls_ai_service {
    server bls-ai-service:7201 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'";

    limit_conn conn 20;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 登录独立限流
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://bls_server;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/system/storage/upload {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://bls_server;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    location /api/common/excel/export {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://bls_server;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/ai/chat/conversations {
        proxy_pass http://bls_server;
    }

    location /api/ai/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://bls_ai_service;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://bls_server;
    }

    location /ws/ai {
        set $ai_upstream bls-ai-service:7201;
        proxy_pass http://$ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 360s;
    }

    location /ws/ {
        proxy_pass http://bls_server;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    location /files/ {
        proxy_pass http://minio:9000/public-assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    location / {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://bls_admin;
    }

    location /health {
        proxy_pass http://bls_server;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
