name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: '操作类型'
        required: true
        type: choice
        options:
          - deploy
          - rollback
      version:
        description: '版本号 (x.y.z)'
        required: true
        type: string
      environment:
        description: '目标环境'
        required: true
        type: choice
        options:
          - production
          - staging
      taskId:
        description: '发布任务ID'
        required: true
        type: string
      services:
        description: '服务列表 (逗号分隔)'
        required: true
        type: string
      callbackUrl:
        description: '回调 URL'
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Callback - pull_images start
        if: inputs.callbackUrl
        run: |
          bash scripts/callback.sh "${{ inputs.callbackUrl }}" "${{ inputs.taskId }}" "pull_images" "running" 20 "开始部署..."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/bls-kox-deploy}"
            cd "$DEPLOY_PATH"
            git fetch origin production
            git checkout production
            git reset --hard origin/production
            if [ "${{ inputs.action }}" = "rollback" ]; then
              ./scripts/rollback.sh "${{ inputs.version }}"
            else
              ./scripts/deploy.sh "${{ inputs.version }}" "${{ inputs.services }}"
            fi

      - name: Callback - complete
        if: success() && inputs.callbackUrl
        run: |
          bash scripts/callback.sh "${{ inputs.callbackUrl }}" "${{ inputs.taskId }}" "complete" "success" 100 "发布完成"

      - name: Callback - failed
        if: failure() && inputs.callbackUrl
        run: |
          bash scripts/callback.sh "${{ inputs.callbackUrl }}" "${{ inputs.taskId }}" "health_check" "failed" 50 "部署失败"
