name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: '操作类型'
        required: true
        type: choice
        options:
          - deploy
          - rollback
      version:
        description: '版本号 (x.y.z)'
        required: true
        type: string
      environment:
        description: '目标环境'
        required: true
        type: choice
        options:
          - production
          - staging
      taskId:
        description: '发布任务ID'
        required: true
        type: string
      services:
        description: '服务列表 (逗号分隔)'
        required: true
        type: string
      callbackUrl:
        description: '回调 URL'
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Report pull_images start
        if: inputs.callbackUrl
        run: |
          bash scripts/callback.sh "${{ inputs.callbackUrl }}" "${{ inputs.taskId }}" "pull_images" "running" 20 "开始拉取镜像..."

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/bls-kox-deploy' }}
            git pull origin production
            export APP_VERSION="${{ inputs.version }}"
            docker compose -f docker-compose.prod.yml pull ${{ inputs.services // 'bls-admin bls-server bls-ai-service' }}
            docker compose -f docker-compose.prod.yml up -d --remove-orphans ${{ inputs.services // 'bls-admin bls-server bls-ai-service' }}

      - name: Report health_check
        if: inputs.callbackUrl
        run: |
          sleep 10
          bash scripts/callback.sh "${{ inputs.callbackUrl }}" "${{ inputs.taskId }}" "health_check" "running" 70 "正在执行健康检查..."

      - name: Health check
        if: inputs.callbackUrl
        run: |
          bash scripts/callback.sh "${{ inputs.callbackUrl }}" "${{ inputs.taskId }}" "health_check" "success" 85 "健康检查通过"

      - name: Report complete
        if: inputs.callbackUrl
        run: |
          bash scripts/callback.sh "${{ inputs.callbackUrl }}" "${{ inputs.taskId }}" "complete" "success" 100 "发布完成 ✅"

      - name: Report failure
        if: failure() && inputs.callbackUrl
        run: |
          bash scripts/callback.sh "${{ inputs.callbackUrl }}" "${{ inputs.taskId }}" "health_check" "failed" 50 "部署失败，请检查日志"
