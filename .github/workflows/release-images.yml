name: Build & Push Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/npcxl

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid tag format: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '\n\r' | xargs)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Tag $TAG_VERSION matches VERSION file"

  build:
    name: Build ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: admin
            context: bls-admin
            dockerfile: bls-admin/Dockerfile
          - name: server
            context: bls-server
            dockerfile: bls-server/Dockerfile
          - name: ai-service
            context: bls-ai-service
            dockerfile: bls-ai-service/Dockerfile
          - name: event-service
            context: bls-event-service
            dockerfile: bls-event-service/Dockerfile
          - name: java-server
            context: bls-java-server
            dockerfile: bls-java-server/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/bls-kox-${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  register:
    name: Register Build
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: vars.RELEASE_CALLBACK_URL
    steps:
      - uses: actions/checkout@v4

      - name: Callback - register version
        run: |
          TIMESTAMP=$(date +%s%3N)
          NONCE=$(openssl rand -hex 16)
          BODY='{"version":"${{ needs.validate.outputs.version }}","status":"built","commitHash":"${{ github.sha }}","services":["admin","server","ai-service","event-service","java-server"]}'
          PAYLOAD="${TIMESTAMP}\n${NONCE}\n${BODY}"
          SIGNATURE=$(printf "${PAYLOAD}" | openssl dgst -sha256 -hmac "${{ secrets.RELEASE_CALLBACK_SECRET }}" | awk '{print $2}')
          curl -sf -X POST "${{ vars.RELEASE_CALLBACK_URL }}/api/ops/releases/build-callback" \
            -H "Content-Type: application/json" \
            -H "X-Release-Timestamp: ${TIMESTAMP}" \
            -H "X-Release-Nonce: ${NONCE}" \
            -H "X-Release-Signature: ${SIGNATURE}" \
            -d "${BODY}" || echo "Build callback failed (ignored)"
