
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ===================== 80：只做 ACME 续签 + 全站跳 HTTPS =====================
server {
    listen 80;
    server_name xlcig.cn www.xlcig.cn admin.xlcig.cn api.xlcig.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/bls-kox/bls-admin/dist;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===================== 443：admin（管理台 + 同域 API） =====================
server {
    listen 443 ssl;
    http2 on;
    server_name admin.xlcig.cn;

    ssl_certificate     /etc/letsencrypt/live/xlcig.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xlcig.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # 确认全站 HTTPS 稳定后再启用 HSTS（一旦启用，回退 HTTP 会很难受）
    # add_header Strict-Transport-Security "max-age=63072000" always;

    root /opt/bls-kox/bls-admin/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ---- /api → bls-server（同源，前端全部走相对路径 /api/...）----
    location /api/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        # Host / X-Forwarded-Host 必须保留原域名：后端按域名解析租户
        # （resolveTenantDomain: X-Forwarded-Host > Host > Origin，TRUST_PROXY=true 才信任前者）
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;                      # AI 对话 SSE 需要
    }

    # ---- /ws → bls-server（Koa 实时通道）----
    location /ws/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ---- 带 contenthash 的静态资源：一年长缓存 ----
    # 文件名由内容决定（config.ts 里 hash: true），内容一变文件名就变，所以长缓存是安全的。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 构建统计文件，不对外
    location = /stats.json { deny all; }

    # ---- SPA ----
    # ⚠ nginx 的 add_header 继承陷阱：同一层级只要出现任意 add_header，
    #    上层（server）里的 add_header 就全部失效 —— 所以这里必须把需要的头写全。
    location / {
        # worker-src 必须允许 blob:/data:：登录页的人机验证（自托管 ALTCHA）的
        # Proof-of-Work 跑在 Web Worker 中，官方包用内联 data: URL 创建 Worker。
        # 缺这条会被 CSP 静默拦截 → 表现成「隐形验证一直不过、登录点不动」。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # index.html 绝不能长缓存：否则用户拿着旧 index 去引已删除的 hash 资源 → 白屏
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ===================== 443：api（纯接口出口） =====================
server {
    listen 443 ssl;
    http2 on;
    server_name api.xlcig.cn;

    ssl_certificate     /etc/letsencrypt/live/xlcig.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xlcig.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 登录只允许走 admin 域名：租户按域名绑定（sys_tenant.domain_name 唯一约束），
    # api.xlcig.cn 上没有绑定租户，登录必然失败。这里显式 403，比抛「当前域名未绑定租户」更清楚。
    location = /api/auth/login { return 403; }
    location ^~ /api/captcha/  { return 403; }

    # 内部接口不对外（本来也有 INTERNAL_SECRET 鉴权，多一层防护）
    location ^~ /internal/     { return 403; }

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# ===================== 443：主域 / www（暂跳管理台） =====================
server {
    listen 443 ssl;
    http2 on;
    server_name xlcig.cn www.xlcig.cn;

    ssl_certificate     /etc/letsencrypt/live/xlcig.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xlcig.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 以后要做官网/门户，就把这一段换成对应的站点配置
    return 301 https://admin.xlcig.cn$request_uri;
}
