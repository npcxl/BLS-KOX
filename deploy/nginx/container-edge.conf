# ============================================================
#  BLS-KOX 容器化边缘 nginx —— 由 docker-compose.server-only.yml 的 edge-nginx 服务加载
#
#  挂载（compose 里已写死）：
#    ./deploy/nginx/container-edge.conf -> /etc/nginx/conf.d/default.conf
#    ./bls-admin/dist                   -> /usr/share/nginx/html      ← 你在本机构建、上传的前端产物
#
#  与宿主机 nginx 方案的差异：
#    - 这里**没有 127.0.0.1**：反向代理目标写的是 compose 服务名 bls-server:7001，
#      两个容器在同一个 bls-net 网络里，用 Docker 内置 DNS（127.0.0.11）解析。
#    - 静态根目录是容器内的 /usr/share/nginx/html，不是宿主机的 /opt/bls-kox/...
#
#  当前只监听 80（HTTP）。等证书签好再加 443：见文件末尾注释。
#  注意：ALTCHA 人机验证要求安全上下文，**HTTP 下登录会失败**，HTTPS 只是时间问题。
# ============================================================

server_tokens off;

# Docker 内置 DNS（配合变量方式的 proxy_pass，容器重启换 IP 也不用重启 nginx）
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;

    # ---- HTTPS（生产已启用）----
    # 证书由 docker-compose.server-only.yml 挂载：./certs -> /etc/nginx/certs:ro
    # ⚠ 用老语法 `listen 443 ssl http2;`：本机 nginx 是 1.21.5，不认 1.25.1+ 才有的 `http2 on;`
    #   （换成 http2 on; 会直接 unknown directive，nginx -t 失败、配置静默不生效）
    listen 443 ssl http2;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # 带上 `_` 是为了能用 IP / 任意域名先测（证书就绪后可以只保留四个域名）
    server_name admin.xlcig.cn xlcig.cn www.xlcig.cn api.xlcig.cn _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 100m;
    limit_conn conn 20;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ---- 证书签发/续签（在宿主机跑 certbot，--webroot 指向前端产物目录）----
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        access_log off;
    }

    # ---- 登录：单独限流 ----
    location /api/auth/login {
        set $backend "bls-server:7001";
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;   # 后端按域名解析租户，不能丢
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    # ---- 上传大文件（与仓库 nginx.conf 对齐：100m + 关缓冲，避免上传被限流/超时）----
    location /api/system/storage/upload {
        set $backend "bls-server:7001";
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # ---- 导出（大文件 + 慢查询，单独放宽超时）----
    location /api/common/excel/export {
        set $backend "bls-server:7001";
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ---- 其余 API ----
    location /api/ {
        set $backend "bls-server:7001";
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;                        # AI 对话 SSE 需要
    }

    # ---- Koa 实时通道 ----
    location /ws/ {
        set $ws_backend "bls-server:7001";
        proxy_pass http://$ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ---- 禁止访问隐藏文件/目录（.git、.env 等；正则 location 优先于前缀 location 匹配）----
    #    注意：上面的 `^~ /.well-known/acme-challenge/` 用 ^~ 前缀，不受这里影响，证书续签照常。
    location ~ /\. {
        deny all;
    }

    # ---- 边缘健康检查（给外部探活用，打到 bls-server 的 /api/health）----
    location = /health {
        set $backend "bls-server:7001";
        proxy_pass http://$backend/api/health;
        access_log off;
    }

    # ---- 带 contenthash 的静态资源：一年长缓存 ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 构建统计文件不对外
    location = /stats.json { deny all; }

    # ---- AI 对话存储/列表（增删改查）→ bls-server ----
    # ⚠ 这条【必须】存在，且比下面的 /api/ai/ 更长（nginx 取最长前缀，顺序无关但写前面更清楚）：
    #   对话元数据与消息存在 MySQL，实现在 bls-server（src/api/ai/chat/index.ts），
    #   只有流式对话/CRUD 生成等才走 AI 微服务。少这条 → /api/ai/chat/conversations 会被
    #   转发到 bls-ai-service（那边没这个路由）→ 前端对话列表 404。
    location /api/ai/chat/conversations {
        set $backend "bls-server:7001";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ---- AI 微服务：必须【排在通用 /api/ 之前】处理语义，nginx 取最长前缀匹配 ----
    # ⚠ AI 请求不经过 bls-server，直接进 bls-ai-service（与仓库根 nginx.conf 一致）。
    #   未部署 AI 服务时这里会 502，这是预期（前端只在用到 AI 时才请求 /api/ai/*）。
    #   SSE 流式必须 proxy_buffering off，否则打字机效果会整段卡住。
    location /api/ai/ {
        set $ai_backend "bls-ai-service:7201";
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://$ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }

    # ---- AI 的 WebSocket 流式（同样取最长前缀，优先于通用 /ws/）----
    location /ws/ai {
        set $ws_ai_backend "bls-ai-service:7201";
        proxy_pass http://$ws_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ---- SPA ----
    # ⚠ nginx 的 add_header 继承陷阱：同一层级只要出现任意 add_header，
    #    上层（server）里的 add_header 就全部失效，所以这里把需要的头写全。
    location / {
        # worker-src 必须允许 blob:/data:：ALTCHA 的 Proof-of-Work 跑在 Web Worker 里，
        # 官方包用内联 data: URL 创建 Worker；缺这条会被 CSP 静默拦掉，表现成"隐形验证一直不过"。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";        # index.html 绝不能长缓存，否则白屏
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
#  HTTPS（证书签好后启用）—— 不复制 server 块，只给上面那个 server 加三行监听
#
#  1) 宿主机上只装 certbot（**不要装 nginx**，80 端口要留给容器），用容器共享的前端目录做 webroot：
#       apt-get install -y certbot
#       certbot certonly --webroot -w /opt/bls-kox/bls-admin/dist \
#         -d xlcig.cn -d www.xlcig.cn -d admin.xlcig.cn -d api.xlcig.cn \
#         --agree-tos -m admin@xlcig.cn --no-eff-email
#  2) 证书放进宿主机项目目录，并在 docker-compose.server-only.yml 的 edge-nginx 里
#     加上挂载与 443 端口（两步各一行）：
#       mkdir -p /opt/bls-kox/certs
#       cp -L /etc/letsencrypt/live/xlcig.cn/fullchain.pem /opt/bls-kox/certs/
#       cp -L /etc/letsencrypt/live/xlcig.cn/privkey.pem   /opt/bls-kox/certs/
#     挂载：  - ./certs:/etc/nginx/certs:ro
#     端口：  - "443:443"
#  3) 本文件已启用 443（见上面 server 块）。用的是老语法 `listen 443 ssl http2;`，
#     因为本机 nginx 是 1.21.5（不认 1.25.1+ 才有的 `http2 on;`）；
#     nginx 升级到 ≥1.25.1 后可换成 `http2 on;`。
#     改完生效（配置文件是 bind mount，不用重建容器；注意别用 `sed -i`，
#     它会换 inode 导致容器仍读旧文件，改完要用 `cat 新文件 > 目标文件` 就地写回）：
#       docker exec bls-edge-nginx nginx -t && docker exec bls-edge-nginx nginx -s reload
#
#  续签：certbot 的 systemd timer 自动续期；续完 cp 一次证书再 reload 即可
#  （或给 certbot 加 --deploy-hook 做这两件事）。HSTS 等站点稳定后再加。
# ============================================================
