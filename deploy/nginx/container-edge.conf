# ============================================================
#  BLS-KOX 容器化边缘 nginx —— 由 docker-compose.server-only.yml 的 edge-nginx 服务加载
#
#  挂载（compose 里已写死）：
#    ./deploy/nginx/container-edge.conf -> /etc/nginx/conf.d/default.conf
#    ./bls-admin/dist                   -> /usr/share/nginx/html      ← 你在本机构建、上传的前端产物
#
#  与宿主机 nginx 方案的差异：
#    - 这里**没有 127.0.0.1**：反向代理目标写的是 compose 服务名 bls-server:7001，
#      两个容器在同一个 bls-net 网络里，用 Docker 内置 DNS（127.0.0.11）解析。
#    - 静态根目录是容器内的 /usr/share/nginx/html，不是宿主机的 /opt/bls-kox/...
#
#  当前只监听 80（HTTP）。等证书签好再加 443：见文件末尾注释。
#  注意：ALTCHA 人机验证要求安全上下文，**HTTP 下登录会失败**，HTTPS 只是时间问题。
# ============================================================

server_tokens off;

# Docker 内置 DNS（配合变量方式的 proxy_pass，容器重启换 IP 也不用重启 nginx）
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    # 带上 `_` 是为了能用 IP / 任意域名先测（证书就绪后可以只保留四个域名）
    server_name admin.xlcig.cn xlcig.cn www.xlcig.cn api.xlcig.cn _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 100m;
    limit_conn conn 20;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ---- 证书签发/续签（在宿主机跑 certbot，--webroot 指向前端产物目录）----
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        access_log off;
    }

    # ---- 登录：单独限流 ----
    location /api/auth/login {
        set $backend "bls-server:7001";
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;   # 后端按域名解析租户，不能丢
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    # ---- 其余 API ----
    location /api/ {
        set $backend "bls-server:7001";
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;                        # AI 对话 SSE 需要
    }

    # ---- Koa 实时通道 ----
    location /ws/ {
        set $ws_backend "bls-server:7001";
        proxy_pass http://$ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ---- 带 contenthash 的静态资源：一年长缓存 ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 构建统计文件不对外
    location = /stats.json { deny all; }

    # ---- SPA ----
    # ⚠ nginx 的 add_header 继承陷阱：同一层级只要出现任意 add_header，
    #    上层（server）里的 add_header 就全部失效，所以这里把需要的头写全。
    location / {
        # worker-src 必须允许 blob:/data:：ALTCHA 的 Proof-of-Work 跑在 Web Worker 里，
        # 官方包用内联 data: URL 创建 Worker；缺这条会被 CSP 静默拦掉，表现成"隐形验证一直不过"。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";        # index.html 绝不能长缓存，否则白屏
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
#  HTTPS（证书签好后启用）—— 不复制 server 块，只给上面那个 server 加三行监听
#
#  1) 宿主机上只装 certbot（**不要装 nginx**，80 端口要留给容器），用容器共享的前端目录做 webroot：
#       apt-get install -y certbot
#       certbot certonly --webroot -w /opt/bls-kox/bls-admin/dist \
#         -d xlcig.cn -d www.xlcig.cn -d admin.xlcig.cn -d api.xlcig.cn \
#         --agree-tos -m admin@xlcig.cn --no-eff-email
#  2) 证书放进宿主机项目目录，并在 docker-compose.server-only.yml 的 edge-nginx 里
#     加上挂载与 443 端口（两步各一行）：
#       mkdir -p /opt/bls-kox/certs
#       cp -L /etc/letsencrypt/live/xlcig.cn/fullchain.pem /opt/bls-kox/certs/
#       cp -L /etc/letsencrypt/live/xlcig.cn/privkey.pem   /opt/bls-kox/certs/
#     挂载：  - ./certs:/etc/nginx/certs:ro
#     端口：  - "443:443"
#  3) 在本文件上面 server 块的 `listen 80;` 后面追加这几行：
#       listen 443 ssl;
#       http2 on;
#       ssl_certificate     /etc/nginx/certs/fullchain.pem;
#       ssl_certificate_key /etc/nginx/certs/privkey.pem;
#       ssl_protocols TLSv1.2 TLSv1.3;
#     然后：
#       docker exec bls-edge-nginx nginx -t && docker exec bls-edge-nginx nginx -s reload
#
#  续签：certbot 的 systemd timer 自动续期；续完 cp 一次证书再 reload 即可
#  （或给 certbot 加 --deploy-hook 做这两件事）。HSTS 等站点稳定后再加。
# ============================================================
