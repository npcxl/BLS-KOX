# ============================================================
# CNB 密钥仓库 — BLS-KOX 部署密钥
# ============================================================
# 将此文件上传到 CNB 仓库的 .cnb/secrets.yml
# 然后在仓库设置中设为「密钥仓库」类型，仅供流水线 imports 使用
#
# ⚠️ 不要提交真实密钥到此文件！
#    在 CNB 平台创建独立的密钥仓库，通过 imports 引用。
#    此文件仅作为模板，展示需要配置哪些变量。
# ============================================================

# ===== SSH 部署凭证 =====
DEPLOY_SSH_HOST: your-server-ip-or-domain
DEPLOY_SSH_USER: root
DEPLOY_SSH_KEY: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  你的服务器 SSH 私钥
  -----END OPENSSH PRIVATE KEY-----

# ===== 部署路径（服务器上项目目录） =====
DEPLOY_PATH: /opt/bls-kox

# ===== 运行时环境变量（注入 docker-compose） =====
# 数据库
DB_PASSWORD: your-db-password
DB_NAME: bls

# Redis
REDIS_PASSWORD: your-redis-password

# JWT
JWT_SECRET: your-jwt-secret-at-least-32-chars

# 内部服务认证
INTERNAL_SECRET: your-internal-secret

# CORS
CORS_ORIGINS: https://your-domain.com

# AI 服务（可选）
AI_PROVIDER: deepseek
AI_MODEL: deepseek-chat
OPENAI_API_KEY: sk-your-api-key

# API 签名（可选）
API_SIGN_SECRET: your-api-sign-secret
